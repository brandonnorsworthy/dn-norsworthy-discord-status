# CI: locked restore, build (warnings as errors), format check, tests, and a non-pushing Docker build.
# Also called by release.yml so a release only publishes what passed these checks.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly sweep to catch upstream breakage when nobody is pushing
    - cron: "17 3 * * 1"
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  SOLUTION: dn-norsworthy-discord-status.sln

jobs:
  # Stable name so branch protection has one required status check to point at
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the version check can compare against the base branch
          fetch-depth: 0

      # Backs the version hook (.githooks/): a PR that changes code must change the version.
      # Dependabot PRs are exempt (dependency-only merges are not bumped).
      - name: Check the version was bumped
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: .githooks/check-version-bump "origin/$BASE_REF" HEAD

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      # The rendering tests draw text with SkiaSharp, which needs fontconfig and a font.
      - name: Install fontconfig and a font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1 fonts-dejavu-core

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # The committed lock files are the dependency set; a PR can't silently change them
      - name: Restore (locked)
        run: dotnet restore "$SOLUTION" --locked-mode

      - name: Build (warnings as errors)
        run: dotnet build "$SOLUTION" -c Release --no-restore -warnaserror

      - name: Verify formatting
        run: dotnet format --verify-no-changes "$SOLUTION"

      - name: Run tests
        run: dotnet test "$SOLUTION" -c Release --no-build

      # Build the image without pushing so a broken Dockerfile fails the PR
      - name: Build Docker image (no push)
        run: docker build --tag statuscard:ci --file Dockerfile .
